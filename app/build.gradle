plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def geminiApiKey = System.getenv('GEMINI_API_KEY') ?: localProperties.getProperty('GEMINI_API_KEY', '')

android {
    namespace 'com.arafatakaid.banglishkeyboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.arafatakaid.banglishkeyboard'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0.${System.getenv('GITHUB_RUN_NUMBER') ?: '1'}"

        buildConfigField 'String', 'GEMINI_API_KEY', '"' + geminiApiKey + '"'
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_FILE') != null &&
                    System.getenv('KEYSTORE_PASSWORD') != null &&
                    System.getenv('KEY_ALIAS') != null &&
                    System.getenv('KEY_PASSWORD') != null) {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE') != null &&
                    System.getenv('KEYSTORE_PASSWORD') != null &&
                    System.getenv('KEY_ALIAS') != null &&
                    System.getenv('KEY_PASSWORD') != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Start.io SDK
    implementation 'com.startapp:inapp-sdk:5.2.0'
}
